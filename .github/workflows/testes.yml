# Roda os testes automaticamente no GitHub a cada envio de codigo.
# O selo "Testes" no README fica verde quando tudo passa.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install flask python-dotenv pytest pandas openpyxl matplotlib pdfplumber fpdf2

      - name: Projeto 4 - testes do app de agendamento
        working-directory: projeto4-agendamento
        run: python -m pytest -v

      - name: Projeto 1 - gera o relatorio com os dados de exemplo
        working-directory: projeto1-relatorio-planilha
        run: |
          python gerar_dados_exemplo.py
          python relatorio.py vendas_exemplo.xlsx
          test -f saida/relatorio_vendas.xlsx

      - name: Projeto 2 - extrai os dados dos PDFs de exemplo
        working-directory: projeto2-extrator-pdf
        run: |
          python extrator.py pdfs_exemplo
          test -f saida/notas_extraidas.xlsx
