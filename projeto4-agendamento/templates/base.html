<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Agendamento{% endblock %} · {{ config.NOME_NEGOCIO }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('inicio') }}">✂️ {{ config.NOME_NEGOCIO }}</a>
    {% if session.admin %}
      <nav>
        <a href="{{ url_for('painel') }}">Agenda</a>
        <a href="{{ url_for('servicos') }}">Serviços</a>
        <form method="post" action="{{ url_for('sair') }}">
          <input type="hidden" name="csrf" value="{{ csrf() }}">
          <button class="link">Sair</button>
        </form>
      </nav>
    {% endif %}
  </header>

  <main>
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
      <p class="aviso {{ categoria }}">{{ mensagem }}</p>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
